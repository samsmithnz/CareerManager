name: Azure SQL integration tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  azure-sql-integration:
    runs-on: ubuntu-latest
    env:
      CAREERMANAGER_TEST_SQL_CONNECTION: ${{ secrets.AZURE_SQL_TEST_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version-file: global.json
      - name: Require an isolated Azure SQL test database
        shell: bash
        run: |
          if [ -z "${CAREERMANAGER_TEST_SQL_CONNECTION:-}" ]; then
            echo "::error::Configure the AZURE_SQL_TEST_CONNECTION_STRING secret with an authorized isolated Azure SQL database before dispatching this workflow."
            exit 1
          fi
      - run: dotnet restore tests/CareerManager.IntegrationTests/CareerManager.IntegrationTests.csproj --locked-mode
      - run: dotnet test tests/CareerManager.IntegrationTests/CareerManager.IntegrationTests.csproj --configuration Release --no-restore
