name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version-file: global.json
      - run: dotnet restore CareerManager.sln --locked-mode
      - run: dotnet tool restore
      - run: dotnet build CareerManager.sln --configuration Release --no-restore
      - run: dotnet test tests/CareerManager.Tests/CareerManager.Tests.csproj --configuration Release --no-build --no-restore
      - run: dotnet list CareerManager.sln package --vulnerable --include-transitive

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
