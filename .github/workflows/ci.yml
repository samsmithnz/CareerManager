name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version-file: global.json
      - run: dotnet restore CareerManager.sln --locked-mode
      - run: dotnet tool restore
      - run: dotnet build CareerManager.sln --configuration Release --no-restore
      - run: dotnet test tests/CareerManager.Tests/CareerManager.Tests.csproj --configuration Release --no-build --no-restore
      - run: dotnet list CareerManager.sln package --vulnerable --include-transitive

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
